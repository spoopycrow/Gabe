<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gabe — Glow Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --bg: #f3f3f3;
        --panel: #1d1d1f;
        --panel-soft: #2a2a2d;
        --text: #111111;
        --muted: #5d5d5d;
        --line: rgba(17,17,17,0.12);
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }

      .phone {
        width: 100%;
        max-width: 430px;
        min-height: 100vh;
        background: #f3f3f3;
        position: relative;
        overflow: hidden;
      }

      .statusbar {
        height: 58px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 18px 0 18px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: #111;
      }

      .status-right,
      .status-left {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .status-right .dot-group {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .status-right .dot {
        width: 4px;
        height: 4px;
        border-radius: 999px;
        background: #111;
      }

      .status-right .wifi {
        position: relative;
        width: 14px;
        height: 10px;
        border: 2px solid #111;
        border-top: 0;
        border-radius: 0 0 10px 10px;
        transform: translateY(-1px);
      }
      .status-right .wifi::before {
        content: "";
        position: absolute;
        inset: 2px 2px auto 2px;
        height: 5px;
        border: 2px solid #111;
        border-top: 0;
        border-radius: 0 0 8px 8px;
      }

      .urlbar-wrap {
        padding: 0 14px 12px;
      }

      .urlbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        background: #2a2a2d;
        border-radius: 22px;
        height: 54px;
        padding: 0 12px 0 14px;
        color: #f3f3f3;
      }

      .url-left {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        flex: 1;
      }

      .lock {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.9);
        position: relative;
        flex-shrink: 0;
      }
      .lock::before {
        content: "";
        position: absolute;
        width: 8px;
        height: 8px;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        border: 2px solid rgba(255,255,255,0.9);
        border-radius: 2px;
      }

      .url-text {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 14px;
        opacity: 0.95;
      }

      .plus-btn {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.85);
        display: grid;
        place-items: center;
        font-size: 26px;
        line-height: 1;
        color: #f4f4f4;
        flex-shrink: 0;
      }

      .badge {
        min-width: 34px;
        height: 22px;
        border-radius: 999px;
        background: rgba(255,255,255,0.12);
        color: #f4f4f4;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 700;
        padding: 0 8px;
      }

      .more {
        width: 12px;
        height: 12px;
        position: relative;
        opacity: 0.9;
      }
      .more::before,
      .more::after,
      .more span {
        content: "";
        position: absolute;
        width: 3px;
        height: 3px;
        background: #f3f3f3;
        border-radius: 50%;
        left: 50%;
        transform: translateX(-50%);
      }
      .more::before { top: 0; }
      .more span { top: 4px; }
      .more::after { top: 8px; }

      .content {
        padding: 20px 0 0;
      }

      .title {
        font-size: clamp(4.2rem, 10vw, 6rem);
        line-height: 0.9;
        letter-spacing: -0.06em;
        font-weight: 900;
        margin: 0 0 28px 0;
        padding-left: 16px;
      }

      .subtitle {
        margin: 0;
        padding-left: 16px;
        max-width: 360px;
        font-size: clamp(2.2rem, 6vw, 3.5rem);
        line-height: 0.96;
        letter-spacing: -0.06em;
        font-weight: 500;
      }

      .bottom-nav {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 90px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 46px 18px 46px;
        background: transparent;
      }

      .nav-icon {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        color: #111;
      }

      .nav-icon.active {
        background: rgba(17,17,17,0.06);
      }

      .nav-icon.grid {
        width: 34px;
        height: 34px;
        position: relative;
      }
      .nav-icon.grid::before,
      .nav-icon.grid::after,
      .nav-icon.grid span::before,
      .nav-icon.grid span::after {
        content: "";
        position: absolute;
        background: #111;
        border-radius: 2px;
      }
      .nav-icon.grid::before { width: 3px; height: 16px; left: 5px; top: 9px; }
      .nav-icon.grid::after { width: 16px; height: 3px; left: 9px; top: 5px; }
      .nav-icon.grid span::before { width: 3px; height: 16px; right: 5px; top: 9px; }
      .nav-icon.grid span::after { width: 16px; height: 3px; right: 9px; top: 19px; }

      .nav-icon circle,
      .nav-icon path,
      .nav-icon polyline,
      .nav-icon line {
        stroke: currentColor;
        fill: none;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .nav-icon svg { width: 30px; height: 30px; }
      .nav-icon.ghost {
        color: rgba(17,17,17,0.5);
      }
      .nav-icon.center {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: rgba(17, 17, 17, 0.04);
      }
      .nav-icon.center svg { width: 34px; height: 34px; }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="statusbar" aria-label="Status bar">
        <div class="status-left"><span>12:31</span></div>
        <div class="status-right">
          <div class="dot-group">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
          <div class="wifi" aria-hidden="true"></div>
          <span>5G</span>
          <span>•</span>
          <span>79</span>
        </div>
      </div>

      <div class="urlbar-wrap">
        <div class="urlbar" aria-label="Address bar">
          <div class="url-left">
            <span class="lock" aria-hidden="true"></span>
            <span class="url-text">spoopycrow.github.io</span>
          </div>
          <div class="plus-btn" aria-label="Add">+</div>
          <div class="badge">23</div>
          <div class="more" aria-label="More options"><span></span></div>
        </div>
      </div>

      <main class="content">
        <h1 class="title">Gabe</h1>
        <p class="subtitle">Glow Up fitness, nutrition, and calendar tracking app</p>
      </main>

      <nav class="bottom-nav" aria-label="Bottom navigation">
        <div class="nav-icon active" aria-label="Menu">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 6.5h18M3 12h18M3 17.5h12" />
          </svg>
        </div>

        <div class="nav-icon center ghost" aria-label="Home">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 10.5 12 3l9 7.5"></path>
            <path d="M5 9.5V20h14V9.5"></path>
          </svg>
        </div>

        <div class="nav-icon ghost" aria-label="Back">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 18l-6-6 6-6"></path>
          </svg>
        </div>
      </nav>
    </div>
  </body>
</html>
